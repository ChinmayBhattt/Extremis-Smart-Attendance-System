# Extremis Application Configuration
spring.application.name=extremis
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/extremis_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# File Upload Configuration (Proof photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Extremis Business Configuration
extremis.attendance.min-percentage=75.0
extremis.attendance.random-checks-count=2
extremis.attendance.verification-window-seconds=90
extremis.attendance.upload-dir=uploads/proofs/
extremis.attendance.photo-retention-days=30

# Session Management
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

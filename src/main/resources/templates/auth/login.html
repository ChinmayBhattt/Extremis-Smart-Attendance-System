<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In — Extremis</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
            width: 100%;
            max-width: 440px;
            padding: 2.25rem;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.9rem;
            border-radius: 50px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .demo-chip {
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            transition: all 0.15s;
        }
        .demo-chip:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-badge mb-3">
                <i class="bi bi-shield-check"></i> College PBL Project
            </div>
            <h2 class="fw-bold tracking-tight mb-1 text-dark">Extremis</h2>
            <p class="text-muted small">Secure Student Presence & Attendance Platform</p>
        </div>

        <!-- Flash messages -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">Error</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}">Success</span>
        </div>
        <div th:if="${warningMessage}" class="alert alert-warning py-2 small d-flex align-items-center gap-2 mb-3" role="alert">
            <i class="bi bi-info-circle-fill"></i>
            <span th:text="${warningMessage}">Warning</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Username or Roll Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. admin or student_arun" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <!-- Client-side device fingerprint (calculated via JS) -->
            <input type="hidden" name="deviceFingerprint" id="deviceFingerprint">
            <input type="hidden" name="deviceName" id="deviceName">

            <button type="submit" class="btn btn-login mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <!-- Quick 1-Click Demo Accounts -->
        <div class="mt-4 pt-3 border-top">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small fw-semibold">Quick Demo Login:</span>
                <span class="badge bg-light text-secondary border">Password: password123</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle demo-chip" onclick="fillLogin('admin', 'password123')">
                    <i class="bi bi-shield-lock me-1"></i>Admin
                </span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle demo-chip" onclick="fillLogin('prof_sharma', 'password123')">
                    <i class="bi bi-mortarboard me-1"></i>Faculty
                </span>
                <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle demo-chip" onclick="fillLogin('teacher_gupta', 'password123')">
                    <i class="bi bi-people me-1"></i>Class Teacher
                </span>
                <span class="badge bg-success-subtle text-success border border-success-subtle demo-chip" onclick="fillLogin('student_arun', 'password123')">
                    <i class="bi bi-person-check me-1"></i>Student (Good %)
                </span>
                <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle demo-chip" onclick="fillLogin('student_rohit', 'password123')">
                    <i class="bi bi-person-exclamation me-1"></i>Student (Defaulter)
                </span>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function fillLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        // Generate client-side device fingerprint
        (function() {
            try {
                const screenRes = `${window.screen.width}x${window.screen.height}x${window.screen.colorDepth}`;
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';
                const platform = navigator.userAgentData?.platform || navigator.platform || 'web';
                const rawString = `${navigator.userAgent}|${screenRes}|${timezone}|${platform}`;
                
                // Simple djb2 hash string
                let hash = 5381;
                for (let i = 0; i < rawString.length; i++) {
                    hash = ((hash << 5) + hash) + rawString.charCodeAt(i);
                }
                const fingerprint = 'DEV-FP-' + Math.abs(hash).toString(16);
                
                document.getElementById('deviceFingerprint').value = fingerprint;
                document.getElementById('deviceName').value = `${platform} Browser (${window.screen.width}x${window.screen.height})`;
            } catch (e) {
                document.getElementById('deviceFingerprint').value = 'DEV-FP-FALLBACK';
                document.getElementById('deviceName').value = 'Standard Web Browser';
            }
        })();
    </script>
</body>
</html>

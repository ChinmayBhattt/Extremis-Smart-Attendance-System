<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Internal Error')}"></head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="container py-5 text-center flex-grow-1 d-flex flex-column justify-content-center align-items-center">
        <div class="card card-custom p-5" style="max-width: 500px;">
            <div class="text-danger mb-3">
                <i class="bi bi-bug fs-1"></i>
            </div>
            <h2 class="fw-bold mb-2">500 — System Error</h2>
            <p class="text-muted">An unexpected server error occurred. Please contact your system administrator.</p>
            <div>
                <a th:href="@{/}" class="btn btn-custom-primary">
                    <i class="bi bi-house-door me-1"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
